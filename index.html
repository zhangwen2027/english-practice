<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分组单词/短语练习</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; background:#f7f9fc; color:#222; }
  h1 { font-size: 22px; }
  .card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px; }
  .prompt { font-size: 20px; margin-bottom: 12px; }
  .en { color:#0b57d0; font-weight:600; }
  .btn { display:inline-block; margin: 6px 8px 6px 0; padding: 10px 14px; border:none; border-radius:10px; background:#e8f0fe; color:#0b57d0; font-size:15px; cursor:pointer; }
  .btn.primary { background:#0b57d0; color:#fff; }
  .btn.recording { background:#d93025; color:#fff; }
  input[type=text], input[type=number], select { width:100%; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:10px; margin:8px 0; box-sizing:border-box; }
  .feedback { min-height: 24px; margin: 8px 0; font-weight:600; }
  .ok { color:#188038; }
  .bad { color:#d93025; }
  .muted { color:#666; font-size:14px; }
  details { margin-top:12px; }
  textarea { width:100%; height:200px; font-size:14px; }
  label { display:block; margin:6px 0; }
  #waveform { width:100%; height:80px; background:#f1f3f4; border-radius:10px; margin:10px 0; display:block; }
  #liveStatus { font-size:14px; color:#d93025; min-height:20px; }
</style>
</head>
<body>
<h1>📚 分组单词/短语练习</h1>

<div id="setup" class="card">
  <p class="muted">每轮数量：</p>
  <label>单词 <input id="wordCount" type="number" value="5" min="1"></label>
  <label>短语 <input id="phraseCount" type="number" value="3" min="1"></label>

  <p class="muted">选择要练习的分组：</p>
  <select id="groupSelect"></select>

  <button id="startBtn" class="btn primary">开始练习</button>

  <details>
    <summary>编辑词库（每行：组号 | 类型 | 英文 | 中文）</summary>
    <textarea id="lexicon"></textarea>
    <button id="saveLexicon" class="btn">保存词库</button>
    <p class="muted">type 填 word 或 phrase，例如：<br>U1-01 | word | apple | 苹果<br>U1-01 | phrase | get up | 起床</p>
  </details>
</div>

<div id="practice" class="card" hidden>
  <div id="progress" class="muted"></div>
  <div id="card">
    <div id="prompt" class="prompt"></div>
    <div>
      <button id="speakBtn" class="btn">🔊 播放英文</button>
      <button id="recordBtn" class="btn">🎤 录我的发音</button>
      <button id="playMyBtn" class="btn" hidden>▶️ 播放我的发音</button>
    </div>
    <div id="liveStatus"></div>
    <canvas id="waveform"></canvas>
    <input id="answer" type="text" autocomplete="off" placeholder="在这里输入答案..." />
    <button id="submitBtn" class="btn primary">提交</button>
    <div id="feedback" class="feedback"></div>
  </div>
  <button id="nextBtn" class="btn primary" hidden>下一题 →</button>
</div>

<script>
// ---------- 默认词库 ----------
const DEFAULT_LEXICON = [
  {group:'U1-01', type:'word', en:'apple', zh:'苹果'},
  {group:'U1-01', type:'word', en:'student', zh:'学生'},
  {group:'U1-01', type:'word', en:'beautiful', zh:'美丽的'},
  {group:'U1-01', type:'word', en:'because', zh:'因为'},
  {group:'U1-01', type:'word', en:'usually', zh:'通常'},
  {group:'U1-01', type:'phrase', en:'get up', zh:'起床'},
  {group:'U1-01', type:'phrase', en:'look after', zh:'照顾'},
  {group:'U1-01', type:'phrase', en:'be good at', zh:'擅长'}
];

let lexicon = loadLexicon();

function loadLexicon(){
  try{
    const raw = localStorage.getItem('lexicon_v2');
    if(raw){
      const arr = JSON.parse(raw);
      return arr.map(item => ({...item, group: item.group || '未分组'}));
    }
  }catch(e){}
  return DEFAULT_LEXICON;
}

function saveLexiconToStorage(){
  localStorage.setItem('lexicon_v2', JSON.stringify(lexicon));
}

function populateGroupSelect(){
  const groups = [...new Set(lexicon.map(i => i.group))].sort();
  const sel = document.getElementById('groupSelect');
  sel.innerHTML = '';
  if(groups.length === 0){
    sel.innerHTML = '<option value="">暂无分组</option>';
    return;
  }
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    sel.appendChild(opt);
  });
}

document.getElementById('saveLexicon').addEventListener('click', ()=>{
  const text = document.getElementById('lexicon').value.trim();
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const newLex = [];
  for(const line of lines){
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length >= 4){
      newLex.push({
        group: parts[0],
        type: parts[1] === 'phrase' ? 'phrase' : 'word',
        en: parts[2],
        zh: parts[3]
      });
    }
  }
  if(newLex.length){
    lexicon = newLex;
    saveLexiconToStorage();
    populateGroupSelect();
    fillLexiconEditor();
    alert('已保存 '+newLex.length+' 条，共 '+new Set(newLex.map(i=>i.group)).size+' 个分组');
  } else {
    alert('格式不正确，请每行：组号 | 类型 | 英文 | 中文');
  }
});

function fillLexiconEditor(){
  document.getElementById('lexicon').value = lexicon.map(i=>`${i.group} | ${i.type} | ${i.en} | ${i.zh}`).join('\n');
}

fillLexiconEditor();
populateGroupSelect();

// ---------- 工具 ----------
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalEn(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }
function normalZh(s){ return s.trim().replace(/\s+/g,''); }

// ---------- 发音 ----------
function speakEn(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.7;

  const voices = window.speechSynthesis.getVoices();
  if(voices.length > 0){
    const preferred = voices.find(v =>
      /en[-_]US/i.test(v.lang) &&
      /Google|Microsoft|Samantha|Zira|Female|Natural/i.test(v.name)
    ) || voices.find(v => /en[-_]US/i.test(v.lang));
    if(preferred) u.voice = preferred;
  }

  speechSynthesis.speak(u);
}

// ---------- 录音 ----------
let mediaRecorder = null;
let chunks = [];
let myAudioURL = null;
let audioCtx = null;
let analyser = null;
let dataArray = null;
let animationId = null;
let stream = null;

const canvas = document.getElementById('waveform');
const canvasCtx = canvas.getContext('2d');
const liveStatus = document.getElementById('liveStatus');

function initAudioAnalyser(stream){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const source = audioCtx.createMediaStreamSource(stream);
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

function drawWaveform(){
  if(!analyser) return;
  animationId = requestAnimationFrame(drawWaveform);
  analyser.getByteTimeDomainData(dataArray);

  canvasCtx.fillStyle = '#f1f3f4';
  canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
  canvasCtx.lineWidth = 2;
  canvasCtx.strokeStyle = '#0b57d0';
  canvasCtx.beginPath();

  const sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for(let i=0; i<dataArray.length; i++){
    const v = dataArray[i] / 128.0;
    const y = v * canvas.height / 2;
    if(i === 0){
      canvasCtx.moveTo(x, y);
    } else {
      canvasCtx.lineTo(x, y);
    }
    x += sliceWidth;
  }
  canvasCtx.lineTo(canvas.width, canvas.height/2);
  canvasCtx.stroke();
}

function stopWaveform(){
  if(animationId){
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  canvasCtx.fillStyle = '#f1f3f4';
  canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
}

async function toggleRecord(){
  const recordBtn = document.getElementById('recordBtn');
  const playBtn = document.getElementById('playMyBtn');

  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    recordBtn.textContent = '🎤 录我的发音';
    recordBtn.classList.remove('recording');
    liveStatus.textContent = '';
    stopWaveform();
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
    }
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    initAudioAnalyser(stream);
    drawWaveform();

    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      if(myAudioURL) URL.revokeObjectURL(myAudioURL);
      myAudioURL = URL.createObjectURL(blob);
      playBtn.hidden = false;
      const audio = new Audio(myAudioURL);
      audio.play();
      stopWaveform();
      if(stream){
        stream.getTracks().forEach(t=>t.stop());
      }
    };
    mediaRecorder.start();
    recordBtn.textContent = '⏹ 停止录音';
    recordBtn.classList.add('recording');
    liveStatus.textContent = '🔴 正在录音…';
  }catch(err){
    alert('无法使用麦克风：'+err.message+'。请使用 https 或 localhost 打开。');
  }
}

document.getElementById('recordBtn').addEventListener('click', toggleRecord);
document.getElementById('playMyBtn').addEventListener('click', ()=>{
  if(myAudioURL){
    new Audio(myAudioURL).play();
  }
});

// ---------- 练习状态 ----------
let questions = [];
let current = 0;
let currentQuestion = null;

document.getElementById('startBtn').addEventListener('click', startPractice);
document.getElementById('speakBtn').addEventListener('click', ()=>{
  if(currentQuestion) speakEn(currentQuestion.item.en);
});
document.getElementById('submitBtn').addEventListener('click', checkAnswer);
document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('answer').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkAnswer();
});

function pickQuestions(){
  const wordCount = parseInt(document.getElementById('wordCount').value) || 5;
  const phraseCount = parseInt(document.getElementById('phraseCount').value) || 3;
  const selectedGroup = document.getElementById('groupSelect').value;

  const groupItems = lexicon.filter(i => i.group === selectedGroup);
  const words = shuffle(groupItems.filter(i=>i.type==='word'));
  const phrases = shuffle(groupItems.filter(i=>i.type==='phrase'));

  const selected = [
    ...words.slice(0, wordCount),
    ...phrases.slice(0, phraseCount)
  ];

  if(selected.length === 0){
    alert('当前组没有词汇，请先编辑词库或选择其他组。');
    return [];
  }

  // 确定哪些单词用较难模式（长度>=6，最多4个）
  const wordItems = selected.filter(item => item.type === 'word');
  const hardCandidates = shuffle(wordItems.filter(item => item.en.length >= 6));
  const hardLimit = Math.min(4, hardCandidates.length);
  const hardSet = new Set(hardCandidates.slice(0, hardLimit).map(item => item.en));

  const result = [];
  for(const item of selected){
    // 看英文写中文
    result.push({item, type:'en2zh', blanked:null});

    // 补全字母
    let difficulty = 'easy';
    if(item.type === 'word' && hardSet.has(item.en)){
      difficulty = 'hard';
    }
    result.push({item, type:'blank', blanked:makeBlank(item.en, difficulty)});
  }
  return result;
}

function makeBlank(en, difficulty = 'easy'){
  // 短语处理：每个单词挖一个字母
  if(en.includes(' ')){
    const words = en.split(' ');
    return words.map(word => {
      if(word.length < 2) return word;
      const pos = Math.floor(Math.random() * word.length);
      return word.substring(0, pos) + '_' + word.substring(pos + 1);
    }).join(' ');
  }

  // 单词处理
  const len = en.length;
  if(len < 4){
    const pos = Math.floor(Math.random() * len);
    return en.substring(0, pos) + '_' + en.substring(pos + 1);
  }

  // 1. 挖掉开头辅音（如果开头是辅音）
  let firstIndex = -1;
  if(/[bcdfghjklmnpqrstvwxyz]/i.test(en[0])){
    firstIndex = 0;
  } else {
    // 开头是元音，尝试挖第二个字母（通常是辅音）
    if(len > 1 && /[bcdfghjklmnpqrstvwxyz]/i.test(en[1])){
      firstIndex = 1;
    }
  }

  // 2. 挖掉结尾部分
  if(difficulty === 'hard'){
    // 较难：挖掉结尾三个字母
    if(len >= 6){
      const cutStart = len - 3;
      let out = '';
      for(let i = 0; i < len; i++){
        if(i === firstIndex || i >= cutStart){
          out += '_';
        } else {
          out += en[i];
        }
      }
      return out;
    } else {
      // 长度不够，挖掉结尾两个字母
      const cutStart = len - 2;
      let out = '';
      for(let i = 0; i < len; i++){
        if(i === firstIndex || i >= cutStart){
          out += '_';
        } else {
          out += en[i];
        }
      }
      return out;
    }
  } else {
    // 较容易：挖掉结尾倒数第二、第三个字母，保留最后一个字母
    if(len >= 4){
      const cutIndices = [len - 2, len - 3];
      let out = '';
      for(let i = 0; i < len; i++){
        if(i === firstIndex || cutIndices.includes(i)){
          out += '_';
        } else {
          out += en[i];
        }
      }
      return out;
    } else {
      // 长度短，只挖一个结尾字母
      const cutIndex = len - 1;
      let out = '';
      for(let i = 0; i < len; i++){
        if(i === firstIndex || i === cutIndex){
          out += '_';
        } else {
          out += en[i];
        }
      }
      return out;
    }
  }
}

function startPractice(){
  questions = pickQuestions();
  if(questions.length === 0) return;
  current = 0;
  document.getElementById('setup').hidden = true;
  document.getElementById('practice').hidden = false;
  showQuestion();
}

function showQuestion(){
  const q = questions[current];
  currentQuestion = q;

  const promptEl = document.getElementById('prompt');
  const answerInput = document.getElementById('answer');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const playMyBtn = document.getElementById('playMyBtn');

  answerInput.value = '';
  feedback.textContent = '';
  feedback.className = 'feedback';
  nextBtn.hidden = true;
  playMyBtn.hidden = true;

  if(myAudioURL){
    URL.revokeObjectURL(myAudioURL);
    myAudioURL = null;
  }
  document.getElementById('recordBtn').textContent = '🎤 录我的发音';
  document.getElementById('recordBtn').classList.remove('recording');
  liveStatus.textContent = '';
  stopWaveform();

  if(q.type === 'en2zh'){
    promptEl.innerHTML = `请写出中文意思：<span class="en">${q.item.en}</span>`;
  } else if(q.type === 'blank'){
    promptEl.innerHTML = `请补全英文：<span class="en">${q.blanked}</span>`;
  }

  document.getElementById('progress').textContent = `第 ${current+1} / ${questions.length} 题`;
  answerInput.focus();
}

function checkAnswer(){
  const q = currentQuestion;
  const input = document.getElementById('answer').value;
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  let ok = false;

  if(q.type === 'blank'){
    ok = normalEn(input) === normalEn(q.item.en);
  } else if(q.type === 'en2zh'){
    ok = normalZh(input) === normalZh(q.item.zh);
  }

  if(ok){
    feedback.textContent = '✅ 正确！';
    feedback.className = 'feedback ok';
  } else {
    feedback.innerHTML = `❌ 错误。正确答案：<span class="en">${q.item.en}</span> / ${q.item.zh}`;
    feedback.className = 'feedback bad';
    speakEn(q.item.en);
  }

  nextBtn.hidden = false;
  document.getElementById('submitBtn').blur();
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    document.getElementById('practice').hidden = true;
    document.getElementById('setup').hidden = false;
    alert('🎉 本轮完成！');
    return;
  }
  showQuestion();
}
</script>
</body>
</html>
