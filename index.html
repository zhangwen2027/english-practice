<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语分组练习·三模块</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; background:#f7f9fc; color:#222; }
  h1 { font-size: 22px; }
  h2 { font-size:18px; margin:16px 0 8px; }
  .card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px; }
  .prompt { font-size: 20px; margin-bottom: 12px; }
  .en { color:#0b57d0; font-weight:600; }
  .btn { display:inline-block; margin: 6px 8px 6px 0; padding: 10px 14px; border:none; border-radius:10px; background:#e8f0fe; color:#0b57d0; font-size:15px; cursor:pointer; }
  .btn.primary { background:#0b57d0; color:#fff; }
  .btn.recording { background:#d93025; color:#fff; }
  input[type=text], input[type=number], select { width:100%; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:10px; margin:8px 0; box-sizing:border-box; }
  .feedback { min-height: 24px; margin: 8px 0; font-weight:600; }
  .ok { color:#188038; }
  .bad { color:#d93025; }
  .muted { color:#666; font-size:14px; }
  details { margin-top:12px; }
  textarea { width:100%; height:180px; font-size:14px; }
  label { display:block; margin:6px 0; }
  #waveform { width:100%; height:80px; background:#f1f3f4; border-radius:10px; margin:10px 0; display:block; }
  #liveStatus { font-size:14px; color:#d93025; min-height:20px; }
  .module-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .module-tab { padding:10px 16px; border-radius:10px; background:#e8f0fe; color:#0b57d0; cursor:pointer; }
  .module-tab.active { background:#0b57d0; color:#fff; }
</style>
</head>
<body>
<h1>📚 英语练习·三模块</h1>

<div class="module-tabs">
  <div id="tab1" class="module-tab active">模块一：重点词汇</div>
  <div id="tab2" class="module-tab">模块二：完整拼写</div>
  <div id="tab3" class="module-tab">模块三：Class 短语</div>
</div>

<!-- 模块一 -->
<div id="module1" class="card">
  <h2>重点词汇挖空</h2>
  <p class="muted">每组数量：</p>
  <label>单词 <input id="m1WordCount" type="number" value="5" min="1"></label>
  <label>短语 <input id="m1PhraseCount" type="number" value="3" min="1"></label>
  <p class="muted">选择分组：</p>
  <select id="m1GroupSelect"></select>
  <button id="m1StartBtn" class="btn primary">开始练习</button>
  <details>
    <summary>编辑词库（重点词汇）</summary>
    <textarea id="m1Lexicon"></textarea>
    <button id="m1SaveLexicon" class="btn">保存词库</button>
    <p class="muted">格式：组号 | word/phrase | 英文 | 中文</p>
  </details>
</div>

<!-- 模块二 -->
<div id="module2" class="card" hidden>
  <h2>完整拼写</h2>
  <p class="muted">选择分组：</p>
  <select id="m2GroupSelect"></select>
  <button id="m2StartBtn" class="btn primary">开始练习</button>
  <details>
    <summary>编辑词库（完整拼写词库）</summary>
    <textarea id="m2Lexicon"></textarea>
    <button id="m2SaveLexicon" class="btn">保存词库</button>
    <p class="muted">格式：组号 | word/phrase | 英文 | 中文</p>
  </details>
</div>

<!-- 模块三 -->
<div id="module3" class="card" hidden>
  <h2>Class 短语句子</h2>
  <p class="muted">选择分组：</p>
  <select id="m3GroupSelect"></select>
  <button id="m3StartBtn" class="btn primary">开始练习</button>
  <details>
    <summary>编辑 Class 短语词库</summary>
    <textarea id="m3Lexicon"></textarea>
    <button id="m3SaveLexicon" class="btn">保存词库</button>
    <p class="muted">格式：组号 | sentence | 完整句子 | 中文</p>
  </details>
  <details>
    <summary>编辑挖空样本</summary>
    <textarea id="m3BlankSamples"></textarea>
    <button id="m3SaveBlankSamples" class="btn">保存挖空样本</button>
    <p class="muted">格式：完整句子 = 挖空后的句子，例如：have classes = have _______</p>
  </details>
</div>

<!-- 练习区 -->
<div id="practice" class="card" hidden>
  <div id="progress" class="muted"></div>
  <div id="card">
    <div id="prompt" class="prompt"></div>
    <div>
      <button id="speakBtn" class="btn">🔊 播放英文</button>
      <button id="recordBtn" class="btn">🎤 录我的发音</button>
      <button id="playMyBtn" class="btn" hidden>▶️ 播放我的发音</button>
    </div>
    <div id="liveStatus"></div>
    <canvas id="waveform"></canvas>
    <input id="answer" type="text" autocomplete="off" placeholder="在这里输入答案..." />
    <button id="submitBtn" class="btn primary">提交</button>
    <div id="feedback" class="feedback"></div>
  </div>
  <button id="nextBtn" class="btn primary" hidden>下一题 →</button>
</div>

<script>
// ---------- 存储 ----------
const STORE_M1 = 'lexicon_m1_v1';
const STORE_M2 = 'lexicon_m2_v1';
const STORE_M3 = 'lexicon_m3_v1';
const STORE_M3_BLANK = 'm3_blank_samples_v1';

let lexiconM1 = loadData(STORE_M1, [
  {group:'U1-01', type:'word', en:'apple', zh:'苹果'},
  {group:'U1-01', type:'word', en:'student', zh:'学生'},
  {group:'U1-01', type:'phrase', en:'get up', zh:'起床'}
]);
let lexiconM2 = loadData(STORE_M2, [
  {group:'U1-01', type:'word', en:'vacation', zh:'假期'},
  {group:'U1-01', type:'word', en:'hotel', zh:'旅馆'}
]);
let lexiconM3 = loadData(STORE_M3, [
  {group:'C1', type:'sentence', en:'have classes', zh:'上课'}
]);
let blankSamplesM3 = loadRaw(STORE_M3_BLANK, 'have classes = have _______');

function loadData(key, def){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return def;
}
function loadRaw(key, def){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return raw;
  }catch(e){}
  return def;
}
function saveData(key, data){ localStorage.setItem(key, JSON.stringify(data)); }
function saveRaw(key, raw){ localStorage.setItem(key, raw); }

function populateSelect(selId, lexicon){
  const sel = document.getElementById(selId);
  const groups = [...new Set(lexicon.map(i => i.group))].sort();
  sel.innerHTML = '';
  if(groups.length === 0){
    sel.innerHTML = '<option value="">暂无分组</option>';
    return;
  }
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    sel.appendChild(opt);
  });
}

function fillEditor(editorId, lexicon){
  document.getElementById(editorId).value = lexicon.map(i=>`${i.group} | ${i.type} | ${i.en} | ${i.zh}`).join('\n');
}

function saveLexiconFromEditor(editorId, storeKey, moduleName){
  const text = document.getElementById(editorId).value.trim();
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const newLex = [];
  for(const line of lines){
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length >= 4){
      newLex.push({group:parts[0], type:parts[1], en:parts[2], zh:parts[3]});
    }
  }
  if(newLex.length){
    if(moduleName === 'm1'){ lexiconM1 = newLex; saveData(STORE_M1, newLex); populateSelect('m1GroupSelect', lexiconM1); }
    if(moduleName === 'm2'){ lexiconM2 = newLex; saveData(STORE_M2, newLex); populateSelect('m2GroupSelect', lexiconM2); }
    if(moduleName === 'm3'){ lexiconM3 = newLex; saveData(STORE_M3, newLex); populateSelect('m3GroupSelect', lexiconM3); }
    alert('已保存 '+newLex.length+' 条');
  } else {
    alert('格式不正确');
  }
}

// 初始化
fillEditor('m1Lexicon', lexiconM1);
fillEditor('m2Lexicon', lexiconM2);
fillEditor('m3Lexicon', lexiconM3);
document.getElementById('m3BlankSamples').value = blankSamplesM3;
populateSelect('m1GroupSelect', lexiconM1);
populateSelect('m2GroupSelect', lexiconM2);
populateSelect('m3GroupSelect', lexiconM3);

document.getElementById('m1SaveLexicon').addEventListener('click', ()=> saveLexiconFromEditor('m1Lexicon', STORE_M1, 'm1'));
document.getElementById('m2SaveLexicon').addEventListener('click', ()=> saveLexiconFromEditor('m2Lexicon', STORE_M2, 'm2'));
document.getElementById('m3SaveLexicon').addEventListener('click', ()=> saveLexiconFromEditor('m3Lexicon', STORE_M3, 'm3'));

document.getElementById('m3SaveBlankSamples').addEventListener('click', ()=>{
  const raw = document.getElementById('m3BlankSamples').value.trim();
  blankSamplesM3 = raw;
  saveRaw(STORE_M3_BLANK, raw);
  alert('挖空样本已保存');
});

// 模块切换
document.getElementById('tab1').addEventListener('click', ()=> switchModule(1));
document.getElementById('tab2').addEventListener('click', ()=> switchModule(2));
document.getElementById('tab3').addEventListener('click', ()=> switchModule(3));

function switchModule(n){
  ['tab1','tab2','tab3'].forEach((id,idx)=>{
    document.getElementById(id).classList.toggle('active', idx === n-1);
  });
  document.getElementById('module1').hidden = n !== 1;
  document.getElementById('module2').hidden = n !== 2;
  document.getElementById('module3').hidden = n !== 3;
}

// ---------- 发音 ----------
function speakEn(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.7;
  const voices = window.speechSynthesis.getVoices();
  if(voices.length > 0){
    const preferred = voices.find(v => /en[-_]US/i.test(v.lang) && /Google|Microsoft|Samantha|Zira|Female|Natural/i.test(v.name)) || voices.find(v => /en[-_]US/i.test(v.lang));
    if(preferred) u.voice = preferred;
  }
  speechSynthesis.speak(u);
}

// ---------- 录音 ----------
let mediaRecorder = null, chunks = [], myAudioURL = null, audioCtx = null, analyser = null, dataArray = null, animationId = null, stream = null;
const canvas = document.getElementById('waveform');
const canvasCtx = canvas.getContext('2d');
const liveStatus = document.getElementById('liveStatus');

function initAudioAnalyser(stream){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  const source = audioCtx.createMediaStreamSource(stream);
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}
function drawWaveform(){
  if(!analyser) return;
  animationId = requestAnimationFrame(drawWaveform);
  analyser.getByteTimeDomainData(dataArray);
  canvasCtx.fillStyle = '#f1f3f4';
  canvasCtx.fillRect(0,0,canvas.width,canvas.height);
  canvasCtx.lineWidth = 2;
  canvasCtx.strokeStyle = '#0b57d0';
  canvasCtx.beginPath();
  const sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for(let i=0;i<dataArray.length;i++){
    const v = dataArray[i] / 128.0;
    const y = v * canvas.height / 2;
    if(i===0) canvasCtx.moveTo(x,y); else canvasCtx.lineTo(x,y);
    x += sliceWidth;
  }
  canvasCtx.lineTo(canvas.width, canvas.height/2);
  canvasCtx.stroke();
}
function stopWaveform(){
  if(animationId) cancelAnimationFrame(animationId);
  animationId = null;
  canvasCtx.fillStyle = '#f1f3f4';
  canvasCtx.fillRect(0,0,canvas.width,canvas.height);
}
async function toggleRecord(){
  const recordBtn = document.getElementById('recordBtn');
  const playBtn = document.getElementById('playMyBtn');
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    recordBtn.textContent = '🎤 录我的发音';
    recordBtn.classList.remove('recording');
    liveStatus.textContent = '';
    stopWaveform();
    if(stream) stream.getTracks().forEach(t=>t.stop());
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    initAudioAnalyser(stream);
    drawWaveform();
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      if(myAudioURL) URL.revokeObjectURL(myAudioURL);
      myAudioURL = URL.createObjectURL(blob);
      playBtn.hidden = false;
      const audio = new Audio(myAudioURL);
      audio.play();
      stopWaveform();
      if(stream) stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    recordBtn.textContent = '⏹ 停止录音';
    recordBtn.classList.add('recording');
    liveStatus.textContent = '🔴 正在录音…';
  }catch(err){
    alert('无法使用麦克风：'+err.message);
  }
}
document.getElementById('recordBtn').addEventListener('click', toggleRecord);
document.getElementById('playMyBtn').addEventListener('click', ()=>{
  if(myAudioURL) new Audio(myAudioURL).play();
});

// ---------- 练习逻辑 ----------
let questions = [], current = 0, currentQuestion = null;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalEn(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }
function normalZh(s){ return s.trim().replace(/\s+/g,''); }

function makeBlank(en, difficulty='easy'){
  if(en.includes(' ')){
    return en.split(' ').map(w=>w.length<2?w:w.substring(0,Math.floor(Math.random()*w.length))+'_'+w.substring(Math.floor(Math.random()*w.length)+1)).join(' ');
  }
  const len = en.length;
  if(len < 4) return en.substring(0,Math.floor(Math.random()*len))+'_'+en.substring(Math.floor(Math.random()*len)+1);
  let firstIndex = /[bcdfghjklmnpqrstvwxyz]/i.test(en[0]) ? 0 : (/[bcdfghjklmnpqrstvwxyz]/i.test(en[1]) ? 1 : -1);
  if(difficulty === 'hard'){
    const cutStart = Math.max(len-3, 2);
    let out='';
    for(let i=0;i<len;i++) out += (i===firstIndex || i>=cutStart) ? '_' : en[i];
    return out;
  } else {
    const cutIndices = [len-2, len-3];
    let out='';
    for(let i=0;i<len;i++) out += (i===firstIndex || cutIndices.includes(i)) ? '_' : en[i];
    return out;
  }
}

function getBlankFromSamples(en){
  const lines = blankSamplesM3.split('\n').map(s=>s.trim()).filter(Boolean);
  for(const line of lines){
    const [full, blank] = line.split('=').map(s=>s.trim());
    if(full.toLowerCase() === en.toLowerCase()) return blank;
  }
  return makeBlank(en, 'easy');
}

function startPractice(module){
  const group = document.getElementById(module.groupSel).value;
  const lex = module.lexicon.filter(i=>i.group===group);
  if(lex.length===0){ alert('当前组没有词汇'); return; }
  questions = [];
  for(const item of shuffle(lex)){
    if(module.id === 'm1'){
      questions.push({item, type:'en2zh'});
      const hardSet = new Set(shuffle(lex.filter(i=>i.type==='word'&&i.en.length>=6)).slice(0,4).map(i=>i.en));
      questions.push({item, type:'blank', blanked:makeBlank(item.en, hardSet.has(item.en)?'hard':'easy')});
    } else if(module.id === 'm2'){
      questions.push({item, type:'zh2en'});
      questions.push({item, type:'en2zh'});
    } else if(module.id === 'm3'){
      questions.push({item, type:'sentenceBlank', blanked:getBlankFromSamples(item.en)});
    }
  }
  if(questions.length===0) return;
  current = 0;
  // 修复：隐藏三个模块设置区，显示练习区
  document.getElementById('module1').hidden = true;
  document.getElementById('module2').hidden = true;
  document.getElementById('module3').hidden = true;
  document.getElementById('practice').hidden = false;
  showQuestion();
}

document.getElementById('m1StartBtn').addEventListener('click', ()=> startPractice({id:'m1', lexicon:lexiconM1, groupSel:'m1GroupSelect'}));
document.getElementById('m2StartBtn').addEventListener('click', ()=> startPractice({id:'m2', lexicon:lexiconM2, groupSel:'m2GroupSelect'}));
document.getElementById('m3StartBtn').addEventListener('click', ()=> startPractice({id:'m3', lexicon:lexiconM3, groupSel:'m3GroupSelect'}));

document.getElementById('speakBtn').addEventListener('click', ()=> { if(currentQuestion) speakEn(currentQuestion.item.en); });
document.getElementById('submitBtn').addEventListener('click', checkAnswer);
document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('answer').addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(); });

function showQuestion(){
  const q = questions[current];
  currentQuestion = q;
  document.getElementById('answer').value = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').hidden = true;
  document.getElementById('playMyBtn').hidden = true;
  if(myAudioURL){ URL.revokeObjectURL(myAudioURL); myAudioURL = null; }
  document.getElementById('recordBtn').textContent = '🎤 录我的发音';
  document.getElementById('recordBtn').classList.remove('recording');
  liveStatus.textContent = '';
  stopWaveform();

  const promptEl = document.getElementById('prompt');
  if(q.type === 'en2zh') promptEl.innerHTML = `请写出中文意思：<span class="en">${q.item.en}</span>`;
  else if(q.type === 'zh2en') promptEl.innerHTML = `请写出英文：<span class="en">${q.item.zh}</span>`;
  else if(q.type === 'blank' || q.type === 'sentenceBlank') promptEl.innerHTML = `请补全英文：<span class="en">${q.blanked}</span>`;

  document.getElementById('progress').textContent = `第 ${current+1} / ${questions.length} 题`;
  document.getElementById('answer').focus();
}

function checkAnswer(){
  const q = currentQuestion;
  const input = document.getElementById('answer').value;
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  let ok = false;
  if(q.type === 'en2zh') ok = normalZh(input) === normalZh(q.item.zh);
  else if(q.type === 'zh2en' || q.type === 'blank' || q.type === 'sentenceBlank') ok = normalEn(input) === normalEn(q.item.en);

  if(ok){
    feedback.textContent = '✅ 正确！';
    feedback.className = 'feedback ok';
  } else {
    feedback.innerHTML = `❌ 错误。正确答案：<span class="en">${q.item.en}</span> / ${q.item.zh}`;
    feedback.className = 'feedback bad';
    speakEn(q.item.en);
  }
  nextBtn.hidden = false;
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    document.getElementById('practice').hidden = true;
    document.getElementById('module1').hidden = false;
    document.getElementById('module2').hidden = false;
    document.getElementById('module3').hidden = false;
    switchModule(1);
    alert('🎉 本轮完成！');
    return;
  }
  showQuestion();
}
</script>
</body>
</html>
